# Postgres for local development, shared by both tracks.
#   docker compose -f infra/compose/dev.yml up -d
# Data lives in the `pgdata` volume; `down -v` wipes it.
name: seedhi-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: guestbook
      POSTGRES_PASSWORD: guestbook
      POSTGRES_DB: guestbook
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guestbook -d guestbook"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
